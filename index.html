<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les maths de début de seconde, facilement. — leçons et exercices de maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<button id="theme" aria-label="Changer de thème" title="Thème clair / sombre">◐</button>
<header>
  <h1>Les maths de début de seconde, facilement.</h1>
  <p>Comprends la leçon, puis entraîne-toi avec des exercices illimités et des corrections pas à pas.</p>
</header>
<nav id="tabs" aria-label="Chapitres"></nav>
<div class="mode" id="mode" role="tablist">
  <button data-m="l" role="tab">Leçon</button>
  <button data-m="e" role="tab">Exercices</button>
  <button data-m="n" role="tab">Notes</button>
</div>
<main>
  <section id="lesson"></section>
  <section id="train" hidden>
    <div class="bar">
      <button id="gen" class="primary">Nouveaux exercices</button>
      <button id="all">Tout corriger</button>
      <span id="score" class="score" title="Réussites du premier coup"></span><button id="rz" title="Remettre le score à zéro">↺</button>
    </div>
    <div id="list"></div>
  </section>
  <section id="notes" hidden>
    <div class="nbox">
      <div class="sym" id="nsym"></div>
      <div class="ngrid"><textarea id="ntxt" spellcheck="false" placeholder="Écris tes notes ici…"></textarea><div id="nprev" class="nprev"></div></div>
      <p class="nhelp">Tape <code>3/4</code>, <code>x^2</code>, <code>sqrt(x)</code>, <code>&lt;=</code>, <code>-&gt;</code>, <code>*</code> : c'est mis en forme automatiquement. <code># titre</code> pour un titre, <code>&gt; texte</code> pour une remarque.</p>
      <div class="bar"><button id="ncopy">Copier</button><button id="ndl">Télécharger</button><button id="nclr">Tout effacer</button></div>
    </div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
